# Settings for qwen-local. Relative paths are resolved against this directory.
# To change settings without editing this file, put overrides in config.local.toml
# (same layout, only the keys you change; it is git-ignored).

[model]
# Unsloth Dynamic IQ4_XS: 14.35 GB, the IQ4_XS build that fits a 16 GB GPU.
# It includes the model's MTP layer, used by server.mtp.
# Alternative: repo = "bartowski/Qwen3.8-27B-GGUF", file = "Qwen3.8-27B-IQ4_XS.gguf"
# (15.48 GB, mmproj_file = "mmproj-Qwen3.8-27B-f16.gguf").
repo = "unsloth/Qwen3.8-27B-GGUF"
revision = "main"
file = "Qwen3.8-27B-UD-IQ4_XS.gguf"
# Vision projector, downloaded with `qwen download --vision`.
mmproj_file = "mmproj-F16.gguf"
dir = "models"
# Model name reported by the OpenAI-compatible API.
alias = "qwen3.8-27b"

[llama_cpp]
# "latest" installs the newest build at install time; pin a tag such as "b12728" to freeze it.
release = "latest"
# "auto" picks the newest CUDA build your driver supports (CPU without an NVIDIA GPU).
# Explicit values: "cuda-13.5", "cuda-12.4", "vulkan", "cpu".
backend = "auto"
dir = "runtime/llama.cpp"
# Path to your own llama-server executable; empty uses the installed build.
server = ""

[server]
host = "127.0.0.1"
port = 8080
# Context window in tokens. 0 picks the largest context that fits in the free VRAM with
# every layer on the GPU, so it adapts to the GPU and to what else is using VRAM: 20-26K
# tokens on a 16 GB card (RTX 4080, RTX 5070 Ti) with a typical Windows desktop.
# The model supports up to 262144; the KV cache costs ~34 KiB per token at q8_0.
# A fixed value larger than what fits pushes layers to the CPU, or worse, makes the driver
# move VRAM into system RAM, which halves the speed and makes it erratic.
ctx_size = 0
# "auto" lets llama.cpp fit as many layers on the GPU as the free VRAM allows
# (the rest run on the CPU). A number forces that many layers onto the GPU.
gpu_layers = "auto"
# VRAM in MiB that automatic fitting leaves free. Windows, browsers and launchers keep
# allocating VRAM while the server runs; with less than ~1 GiB spare the driver starts
# swapping the model's memory to system RAM.
fit_target_mib = 1024
# KV cache precision: f16, q8_0, q4_0. q8_0 halves memory at negligible quality cost.
cache_type_k = "q8_0"
cache_type_v = "q8_0"
flash_attn = "on"
# Concurrent request slots; each one keeps its own recurrent state.
parallel = 1
batch_size = 2048
# Tokens per GPU step during prompt processing. 256 rather than llama.cpp's 512: on a
# 16 GB card it frees VRAM for ~7K more tokens of context at ~4% slower prompt processing.
ubatch_size = 256
# CPU threads for layers that run on the CPU; 0 lets llama.cpp decide.
threads = 0
# Image input; needs the projector (`qwen download --vision`, ~0.9 GB).
vision = false
# Keep the projector on the GPU. Off leaves VRAM to the model and encodes images on the CPU.
mmproj_offload = false
# Speculative decoding with the model's built-in MTP layer: ~1.5x faster generation
# (RTX 5070 Ti: 70 vs 47 tokens/s), but it takes ~0.5 GiB of VRAM, which the automatic
# context gives up: on a 16 GB card the context drops to ~13K tokens.
# Try it with: .\serve.ps1 --mtp
mtp = false
mtp_draft_max = 2
# Thinking depth: "xhigh" (model default, longest), "medium", "low", or "off"
# (answers without thinking). Chat clients can override it per request.
reasoning_effort = "xhigh"
# Extra llama-server arguments, e.g. ["--metrics"].
extra_args = []

# Sampling recommended by the Qwen team. The server starts with the thinking preset;
# `qwen chat --no-think` sends the instruct preset with each request.
[sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
repeat_penalty = 1.0

[sampling.instruct]
temperature = 0.7
top_p = 0.8
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0
